name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  PUPPETEER_SKIP_DOWNLOAD: "true"

  # Non-secret placeholders used only during CI build-time prerendering.
  NEXT_PUBLIC_SUPABASE_URL: "https://ci-placeholder.supabase.co"
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "ci-publishable-key-not-a-secret"
  SUPABASE_SERVICE_ROLE_KEY: "ci-service-role-key-not-a-secret"
  NEXT_PUBLIC_ADMIN_DOMAIN: "admin.ci.invalid"
  NEXT_PUBLIC_ROOT_DOMAIN: "ci.invalid"

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Prepare CI evidence
        shell: bash
        run: mkdir -p ci-artifacts

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund 2>&1 |
            tee ci-artifacts/npm-ci.log

      - name: Lint
        shell: bash
        run: |
          set -euo pipefail
          npm run lint 2>&1 |
            tee ci-artifacts/lint.log

      - name: Typecheck
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck 2>&1 |
            tee ci-artifacts/typecheck.log

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          npm run test -- --reporter=default --reporter=junit --outputFile=ci-artifacts/vitest-junit.xml 2>&1 |
            tee ci-artifacts/test.log

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 |
            tee ci-artifacts/build.log

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-artifacts/
            coverage/
            test-results/
          if-no-files-found: warn
          retention-days: 14
